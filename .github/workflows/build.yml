name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Create .env file
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo "GROQ_MODEL=qwen/qwen3.8-27b" >> .env
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Create .env file
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf "GROQ_API_KEY=%s\nGROQ_MODEL=qwen/qwen3.8-27b\n" "$GROQ_API_KEY" > .env
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GROQ_API_KEY" https://api.groq.com/openai/v1/models)
          if [ "$code" != "200" ]; then
            echo "::error::GROQ_API_KEY is invalid (HTTP $code). AI analysis would not work."
            exit 1
          fi
          echo "Groq API key verified."
      
      - name: Build iOS (No Codesigning)
        run: flutter build ios --release --no-codesign
      
      - name: Create .app and .ipa archives
        run: |
          cd build/ios/iphoneos
          zip -r -y Runner.app.zip Runner.app
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r -y Runner.ipa Payload
      
      - name: Upload iOS .app Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app.zip

      - name: Upload iOS .ipa Package
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/Runner.ipa
